<title>PHARM MASTER</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app shell — sticky sidebar rail on desktop, scrolling chip nav on phones; content column max ~1080px.
   Vernacular: pharmacy labels + auxiliary warning stickers; lab values in mono. */
:root{
  --bg:#eef3f4; --surface:#ffffff; --surface-2:#f6f9fa; --ink:#0f2329; --muted:#56696f; --line:#d3dee1;
  --accent:#0a7570; --accent-soft:#d8eeec; --accent-ink:#ffffff;
  --sticker:#f4c542; --sticker-ink:#3a2c00; --danger:#b8401a; --danger-soft:#fbe5dc; --ok:#1d7d47; --ok-soft:#dcf1e4;
  --warn-soft:#fdf3d4; --shadow:0 1px 2px rgba(15,35,41,.06),0 4px 14px rgba(15,35,41,.06);
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:12px; --r-sm:8px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --t-xs:.8rem; --t-sm:.9rem; --t-md:1.0625rem; --t-lg:1.25rem; --t-xl:1.6rem; --t-2xl:2.2rem;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c1517; --surface:#13201f; --surface-2:#182826; --ink:#e4efee; --muted:#92a8a6; --line:#26393a;
  --accent:#3dc1b6; --accent-soft:#163a37; --accent-ink:#04201d;
  --sticker:#e2b538; --sticker-ink:#231a00; --danger:#f08356; --danger-soft:#3a1d12; --ok:#56c98a; --ok-soft:#123222;
  --warn-soft:#332a0e; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0c1517; --surface:#13201f; --surface-2:#182826; --ink:#e4efee; --muted:#92a8a6; --line:#26393a;
  --accent:#3dc1b6; --accent-soft:#163a37; --accent-ink:#04201d;
  --sticker:#e2b538; --sticker-ink:#231a00; --danger:#f08356; --danger-soft:#3a1d12; --ok:#56c98a; --ok-soft:#123222;
  --warn-soft:#332a0e; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:var(--t-md);line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:var(--t-2xl);font-weight:700} h2{font-size:var(--t-xl);font-weight:650} h3{font-size:var(--t-lg);font-weight:650} h4{font-size:var(--t-md);font-weight:650}
p{margin:0} ul{margin:0;padding-left:1.2em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:var(--t-sm)} .xs{font-size:var(--t-xs)}
.label{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* shell */
.shell{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%}
.shell>*{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top-row{display:flex;align-items:center;gap:var(--s3);justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:.02em}
.brand small{font-family:var(--f-body);font-weight:400;font-size:var(--t-xs);color:var(--muted);letter-spacing:0;display:block}
.top-tools{display:flex;gap:8px;align-items:center}
.sync{font-size:var(--t-xs);color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.on{background:var(--ok)}
.nav{display:flex;gap:6px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:0 0 auto;text-decoration:none;color:var(--ink);padding:8px 12px;border-radius:999px;border:1px solid var(--line);font-size:var(--t-sm);display:flex;align-items:center;gap:6px;min-height:40px;background:var(--surface)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.nav svg{width:16px;height:16px;flex:none}
.main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:var(--s5) var(--s7);min-width:0}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:var(--s5)}
@media (min-width:960px){
  .shell{grid-template-columns:232px minmax(0,1fr)}
  .top{position:sticky;top:0;height:100vh;height:100dvh;border-bottom:0;border-right:1px solid var(--line);padding-block:20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
  body::before{display:none}
  .top-row{flex-direction:column;align-items:flex-start}
  .nav{flex-direction:column;overflow:visible;padding-top:4px}
  .nav a{border-color:transparent;border-radius:10px;padding:9px 12px;background:transparent}
  .nav a:hover{background:var(--surface-2)}
  .main{padding-block:var(--s6) var(--s7)}
}
.foot{font-size:var(--t-xs);color:var(--muted);border-top:1px solid var(--line);padding-top:var(--s4)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s5);box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.panel{background:var(--surface-2);border-radius:var(--r);padding:var(--s4)}
.grid{display:grid;gap:var(--s4)}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.row{display:flex;gap:var(--s3);flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.stack{display:grid;gap:var(--s3)}
.stack-lg{display:grid;gap:var(--s5)}
.hr{height:1px;background:var(--line);border:0;margin:0}
.head{display:grid;gap:6px}
.head p{color:var(--muted);max-width:65ch}

/* buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.2}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:var(--t-sm)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:9px 14px;min-height:42px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.field{display:grid;gap:4px}
.field label{font-size:var(--t-xs);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:96px;resize:vertical}

/* chips & badges */
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:var(--t-xs);font-weight:700;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.sys-dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.badge-S{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.badge-P{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.badge-R{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.badge-flag{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.lvl{font-size:var(--t-xs);font-weight:700;border-radius:6px;padding:2px 8px;border:1px solid var(--line)}
.lvl-New{color:var(--muted)} .lvl-Learning{background:var(--warn-soft);border-color:transparent}
.lvl-Reviewing{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.lvl-Strong{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.lvl-Maintained{background:var(--ok);color:var(--surface);border-color:transparent}

/* pharmacy-label drug card */
.rx{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0;text-align:left;cursor:pointer;padding:0;box-shadow:var(--shadow)}
.rx:hover{border-color:var(--ink)}
.rx-band{height:6px}
.rx-body{padding:var(--s4);display:grid;gap:8px;flex:1}
.rx-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rx-name{font-family:var(--f-display);font-weight:700;font-size:1.15rem;line-height:1.2}
.rx-brand{font-size:var(--t-sm);color:var(--muted)}
.rx-num{font-family:var(--f-mono);font-size:var(--t-xs);color:var(--muted);white-space:nowrap}
.rx dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0;font-size:var(--t-sm)}
.rx dt{font-weight:700;color:var(--muted);font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.rx dd{margin:0}
.sticker{background:var(--sticker);color:var(--sticker-ink);font-size:var(--t-sm);font-weight:700;padding:8px 12px;border-radius:6px;transform:rotate(-.6deg);line-height:1.35}
.sticker::before{content:"⚠ ";font-weight:800}
.rx-foot{display:flex;gap:6px;flex-wrap:wrap;padding:0 var(--s4) var(--s4)}

/* deep dive */
.chain{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.chain .node{flex:1 1 160px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:var(--t-sm);min-width:0}
.chain .node b{display:block;font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px}
.chain .node.first{background:var(--accent-soft);border-color:transparent}
.chain .node.last{background:var(--ok-soft);border-color:transparent}
.chain .arr{display:flex;align-items:center;color:var(--muted)}
.facts{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.facts .f{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.facts .f:first-child{border-top:0}
.facts .f:nth-child(odd){background:var(--surface-2)}
.facts .k{font-weight:700;font-size:var(--t-sm);color:var(--muted)}
@media (max-width:560px){.facts .f{grid-template-columns:1fr;gap:2px}}
.flagbox{border:1px solid var(--danger);background:var(--danger-soft);border-radius:var(--r);padding:12px 14px;font-size:var(--t-sm)}
.srcline{font-size:var(--t-xs);color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.srcline svg{flex:none;margin-top:2px}

/* gauge & bars */
.gauge{display:flex;gap:var(--s5);align-items:center;flex-wrap:wrap}
.gauge svg{width:150px;height:150px;flex:none}
.bar{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;position:relative;border:1px solid var(--line)}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px}
.bar.ok>i{background:var(--ok)} .bar.bad>i{background:var(--danger)}
.stat{display:grid;gap:2px}
.stat .v{font-family:var(--f-display);font-size:1.8rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.sysrow{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;font-size:var(--t-sm)}
@media (max-width:480px){.sysrow{grid-template-columns:110px 1fr 40px}}

/* questions */
.q{display:grid;gap:var(--s4)}
.q-stem{font-size:1.1rem;line-height:1.5;max-width:70ch}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;cursor:pointer;min-height:48px;line-height:1.4}
.opt:hover{border-color:var(--ink)}
.opt .mk{flex:none;width:24px;height:24px;border:2px solid var(--muted);border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:800;font-family:var(--f-mono)}
.opt.sq .mk{border-radius:5px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .mk{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--danger);background:var(--danger-soft)}
.opt[disabled]{cursor:default}
.ord{display:grid;gap:8px}
.ord li{list-style:none;display:flex;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:8px 8px 8px 12px;background:var(--surface)}
.ord li .t{flex:1;min-width:0}
.ord li .n{font-family:var(--f-mono);font-weight:700;color:var(--muted);width:22px}
.ord li.correct{border-color:var(--ok)} .ord li.wrong{border-color:var(--danger)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{border-color:var(--ink)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
.tbl table{border-collapse:collapse;width:100%;min-width:520px;font-size:var(--t-sm)}
.tbl th,.tbl td{border-top:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
.tbl thead th{border-top:0;background:var(--surface-2);font-family:var(--f-display);font-size:var(--t-sm)}
.tbl tbody th{background:var(--surface-2);font-weight:700;white-space:nowrap}
.mx td{text-align:center}
.mx input{width:22px;height:22px;accent-color:var(--accent)}
.mx td.ok{background:var(--ok-soft)} .mx td.bad{background:var(--danger-soft)}
.bow{display:grid;gap:var(--s4);grid-template-columns:1fr}
@media (min-width:760px){.bow{grid-template-columns:1fr 1fr 1fr;align-items:start}}
.bow h4{font-size:var(--t-sm);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fb{border-radius:var(--r);padding:var(--s4);display:grid;gap:10px;border:1px solid var(--line)}
.fb.ok{background:var(--ok-soft);border-color:transparent} .fb.bad{background:var(--danger-soft);border-color:transparent}
.fb h4{display:flex;gap:8px;align-items:center}
.why{display:grid;gap:6px;font-size:var(--t-sm)}
.why div{padding-left:12px;border-left:3px solid var(--line)}
.conf{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.conf .label{margin-right:4px}
.progress-line{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress-line i{display:block;height:100%;background:var(--accent)}

/* flashcard */
.flash{border:2px dashed var(--line);border-radius:var(--r);padding:var(--s5);display:grid;gap:var(--s4);background:var(--surface)}
.flash .prompt{font-family:var(--f-display);font-size:1.3rem;font-weight:650;line-height:1.3}
.reveal{border-top:1px dashed var(--line);padding-top:var(--s4);display:grid;gap:8px}

/* match game */
.match{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.match .col{display:grid;gap:8px;align-content:start}
.tile{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;min-height:52px;text-align:left;cursor:pointer;font-size:var(--t-sm);line-height:1.35}
.tile:hover{border-color:var(--ink)}
.tile[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tile.done{border-color:transparent;background:var(--ok-soft);color:var(--ok);cursor:default}
.tile.shake{animation:shake .35s;border-color:var(--danger)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (max-width:420px){.tile{padding:10px;font-size:.85rem}}

/* MAR record */
.mar{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mar .order{background:var(--ink);color:var(--surface);padding:12px 16px;font-family:var(--f-mono);font-size:var(--t-sm)}
.mar .order b{font-family:var(--f-body);font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.08em;opacity:.7;display:block}
.mar .f{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:9px 16px;border-top:1px solid var(--line);font-size:var(--t-sm)}
.mar .f:nth-child(even){background:var(--surface-2)}
.mar .k{font-weight:700;color:var(--muted)}
@media (max-width:480px){.mar .f{grid-template-columns:1fr;gap:0}}

/* rescue cues */
.cues{display:grid;gap:8px}
.cue{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface-2);border-left:4px solid var(--danger);font-weight:600}
.cue.hidden{border-left-color:var(--line);color:var(--muted);font-weight:400}

/* system tiles */
.systile{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;cursor:pointer;min-height:72px}
.systile:hover{border-color:var(--ink)}
.systile .ic{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;flex:none}
.systile .ic svg{width:26px;height:26px}
.systile .meta{display:grid;gap:2px;min-width:0}

/* modal confirm */
.inline-confirm{border:1px solid var(--danger);border-radius:var(--r);padding:var(--s4);background:var(--danger-soft);display:grid;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;z-index:50;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.phase{display:flex;gap:6px;flex-wrap:wrap}
.phase span{font-size:var(--t-xs);font-weight:700;padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.phase span.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.phase span.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.empty{padding:var(--s5);text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.kbd{font-family:var(--f-mono);font-size:var(--t-xs);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px}
.hero{display:grid;gap:var(--s4);grid-template-columns:1fr;align-items:center}
@media (min-width:760px){.hero{grid-template-columns:1fr auto}}
.hero-art{width:160px;height:auto;justify-self:center}
details summary{cursor:pointer;font-weight:700}
.steps{display:grid;gap:6px;counter-reset:s;font-size:var(--t-sm)}
.steps div{counter-increment:s;padding:8px 12px 8px 40px;position:relative;background:var(--surface-2);border-radius:8px;font-family:var(--f-mono)}
.steps div::before{content:counter(s);position:absolute;left:12px;top:8px;font-weight:800;color:var(--accent)}
@media (max-width:959px){
  .brand{white-space:nowrap;font-size:1.05rem}
  .brand small{display:none}
  .sync span:not(.dot){display:none}
  .sync{font-size:0}
}

/* ===== MED MATH LAB ===== */
:root{ --mm-blue:#2558b8; --mm-blue-soft:#e3ecfb; --mm-purple:#7344b8; --mm-purple-soft:#efe7fa; --mm-amber:#b7791f; --mm-amber-soft:#fdf2dc; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --mm-blue:#7ea6f2; --mm-blue-soft:#1a2a45; --mm-purple:#b494ea; --mm-purple-soft:#2b2140; --mm-amber:#e4b25a; --mm-amber-soft:#3a2d10; } }
:root[data-theme="dark"]{ --mm-blue:#7ea6f2; --mm-blue-soft:#1a2a45; --mm-purple:#b494ea; --mm-purple-soft:#2b2140; --mm-amber:#e4b25a; --mm-amber-soft:#3a2d10; }
.mm-subnav{gap:6px}
.mm-big .mm-bigcard,.mm-bigcard,.mm-lessoncard{text-align:left;cursor:pointer;color:var(--ink)}
.mm-bigcard svg{color:var(--mm-blue)}
.mm-bigcard:hover,.mm-lessoncard:hover{border-color:var(--ink)}
.formula-box{background:var(--mm-blue-soft);border:2px solid var(--mm-blue);border-radius:10px;padding:12px 16px;font-family:var(--f-mono);font-weight:700;font-size:1.05rem;line-height:1.5;overflow-x:auto}
.formula-box.big{font-size:1.3rem}
.formula-box::before{content:"FORMULA · ";font-family:var(--f-body);font-size:var(--t-xs);letter-spacing:.08em;color:var(--mm-blue)}
.mm-steps{display:grid;gap:8px}
.mm-step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border-radius:10px;background:var(--surface-2);border-left:5px solid var(--line)}
.mm-step.setup{border-left-color:var(--mm-blue)}
.mm-step.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.mm-step .sn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:var(--f-mono);background:var(--surface);border:2px solid var(--mm-blue);color:var(--mm-blue)}
.mm-step.ok .sn{border-color:var(--ok);color:var(--ok)}
.mm-step ul{margin-top:4px}
.gchip{display:inline-flex;flex-direction:column;gap:0;border:1px solid var(--mm-blue);background:var(--mm-blue-soft);border-radius:8px;padding:4px 10px;font-weight:700;font-variant-numeric:tabular-nums}
.cancel{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--mm-purple);color:var(--muted)}
.mm-caution{background:var(--mm-amber-soft);border:1px solid var(--mm-amber);border-radius:10px;padding:10px 14px;font-size:var(--t-sm)}
.err-tag{display:inline-block;background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger);border-radius:6px;padding:0 8px;font-size:var(--t-xs);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.err-text{color:var(--danger);font-weight:600}
.ok-text{color:var(--ok);font-weight:600}
.mm-answer{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,180px);gap:12px;align-items:end;max-width:520px}
.mm-answer input{font-family:var(--f-mono);font-size:1.4rem;font-weight:700}
.mm-visual{background:var(--surface-2);border-radius:var(--r);padding:12px;overflow-x:auto}
.mm-svg{width:100%;max-width:520px;height:auto;display:block}
.mm-svg.pump{max-width:360px}.mm-svg.drip{max-width:120px}
.mm-conv{display:grid;gap:12px}
.pump.running .drop{animation:pdrop 1.2s linear infinite}
@keyframes pdrop{0%{transform:translateY(0);opacity:1}80%{transform:translateY(18px);opacity:1}100%{transform:translateY(20px);opacity:0}}
.drip .falling{animation-name:dfall;animation-timing-function:ease-in;animation-iteration-count:infinite}
@keyframes dfall{0%{transform:translateY(0);opacity:1}85%{transform:translateY(70px);opacity:1}100%{transform:translateY(76px);opacity:0}}
.keypad{display:grid;gap:8px;max-width:280px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
.keypad .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.keypad .calc-disp{text-align:right;font-size:1.2rem}
.cheat-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.cheat-card{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;background:var(--surface);break-inside:avoid}
.cheat-eq{font-family:var(--f-mono);font-size:1.25rem;font-weight:700;line-height:1.4;color:var(--ink);background:var(--mm-blue-soft);border-radius:8px;padding:10px 12px}
.opt.x{opacity:.7}
body.printing .top{display:none}
body.printing .shell{grid-template-columns:minmax(0,1fr)}
.print-sheet{background:#fff;color:#111;box-shadow:none}
.print-sheet .cheat-card{background:#fff;border-color:#999}
.print-sheet .cheat-eq{background:#f1f1f1;color:#111}
.print-sheet .label,.print-sheet .muted{color:#444}
@media print{ .top,.mm-subnav,.no-print,.foot,.head{display:none!important} body,html{background:#fff;color:#111} .shell{display:block} .card{box-shadow:none;border:0} .cheat-grid{grid-template-columns:1fr 1fr} .cheat-eq{background:#f1f1f1;color:#111} }
@media (max-width:480px){ .mm-answer{grid-template-columns:1fr} .formula-box.big{font-size:1.1rem} }
.chip-wrap{white-space:normal;text-align:left}
.stack>*,.stack-lg>*{min-width:0}
.mm-steps .mono{overflow-wrap:anywhere}

 why:{3:"Antacids decrease phenytoin's effect.",5:"Never stop antiepileptics abruptly."},
 src:["NEU","Antiepileptic patient education; NEUW interactions"],obj:"Teach phenytoin safety.",short:"Phenytoin: gums, rash, backup BC, same time daily."},
{id:"n3",sys:["neuro"],fmt:"mc",d:2,drug:"donepezil",concept:"donepezil",
 stem:"Before giving donepezil, which assessment is most important?",
 opts:["Heart rate","Serum potassium","Blood glucose","Urine color"],key:0,
 rat:"Donepezil can cause bradycardia (and AF); monitor HR. It is given in the evening before bed.",
 src:["NEUW","Neuro medications table: donepezil"],obj:"Prioritize donepezil assessment.",short:"Donepezil → check HR."},
{id:"n4",sys:["neuro"],fmt:"mc",d:2,drug:"carbidopa",concept:"pd-meds",
 stem:"A client with Parkinson disease on carbidopa-levodopa reports dizziness when getting out of bed. Which instruction is best?",
 opts:["Sit on the edge of the bed for a few minutes before standing","Skip the morning dose","Increase protein at breakfast","Stand up quickly to get blood flowing"],key:0,
 rat:"Orthostatic hypotension is common; rise slowly. High-protein meals can reduce levodopa effect.",
 src:["NEUW","Parkinson medications table"],obj:"Manage carbidopa-levodopa orthostasis.",short:"Levodopa → rise slowly."},
{id:"n5",sys:["neuro","psych"],fmt:"mc",d:2,drug:"lorazepam",concept:"status-epi",
 stem:"A client's generalized seizure has lasted 6 minutes. Which drug class does the nurse anticipate first?",
 opts:["IV benzodiazepine such as lorazepam","Oral phenytoin","Levetiracetam by mouth","Carbamazepine suspension"],key:0,
 rat:"Seizure >5 min is status epilepticus: IV benzodiazepines first, followed by a long-term anticonvulsant.",
 src:["NEU","Seizure disorders: status epilepticus"],obj:"Recognize status epilepticus treatment.",short:"Seizure >5 min → IV benzo."},
{id:"n6",sys:["neuro"],fmt:"matrix",d:2,concept:"aed-monitor",
 stem:"Match each antiepileptic with the priority monitoring from your course table.",
 rows:["Phenytoin","Carbamazepine","Valproic acid","Levetiracetam"],cols:["Level 10–20 mcg/mL, gums","CBC (bone marrow suppression)","Liver function, pancreatitis signs","Few interactions; preferred for prophylaxis"],key:[0,1,2,3],
 rat:"From your Neuro antiepileptics table.",src:["NEU","Antiepileptics table"],obj:"Pair antiepileptics with monitoring.",short:"Phenytoin-level; Carbamazepine-CBC; Valproate-liver; Keppra-easy."},

/* ── MATERNAL ── */
{id:"m1",sys:["mat"],fmt:"mc",d:3,drug:"magsulfate",concept:"mag-tox",
 stem:"A client with severe preeclampsia on magnesium sulfate 2 g/h: RR 11, patellar reflexes absent, urine output 60 mL in 4 hours, drowsy. Which action is first?",
 opts:["Stop the magnesium infusion and notify the provider; prepare calcium gluconate","Recheck reflexes in 1 hour","Increase IV fluids to boost urine output","Turn the client supine for better assessment"],key:0,
 rat:"Absent reflexes, RR <16 and low output (<100 mL/4 h) are toxicity signs: withhold further magnesium and have calcium gluconate (antidote) ready.",
 why:{1:"Delays treatment of toxicity.",2:"Doesn't address toxicity and needs an order.",3:"Supine causes hypotension; side-lying is preferred."},
 src:["MAT","Magnesium sulfate adverse effects"],obj:"Recognize magnesium toxicity.",short:"Mag tox: no reflexes, RR <16, low output → stop, calcium."},
{id:"m2",sys:["mat"],fmt:"mc",d:2,drug:"oxytocin",concept:"oxytocin-decel",
 stem:"During an oxytocin induction, the monitor shows contractions every 1.5 minutes and recurrent late decelerations. What should the nurse do first?",
 opts:["Stop the oxytocin infusion","Increase the oxytocin rate","Place the client supine","Document and continue monitoring"],key:0,
 rat:"Tachysystole with late decelerations means uteroplacental insufficiency. Stop oxytocin first, then intrauterine resuscitation (side-lying, fluids, O₂ per protocol) and notify.",
 src:["MAT","Uterine stimulants: oxytocin"],obj:"Respond to oxytocin complications.",short:"Pit problem → stop the Pit."},
{id:"m3",sys:["mat"],fmt:"mc",d:2,drug:"methylergonovine",concept:"methergine-htn",
 stem:"A postpartum client with a boggy uterus has BP 158/102. Which prescription should the nurse question?",
 opts:["Methylergonovine 0.2 mg IM","Oxytocin infusion","Fundal massage","Assess lochia every 15 minutes"],key:0,
 rat:"Methylergonovine causes hypertension and is contraindicated in hypertensive or preeclamptic clients.",
 src:["MAT","Methylergonovine"],obj:"Identify methylergonovine contraindications.",short:"Methergine + high BP = no."},
{id:"m4",sys:["mat","blood"],fmt:"mc",d:1,drug:"rhogam",concept:"rhogam",
 stem:"Which postpartum client needs Rho(D) immune globulin?",
 opts:["Rh-negative mother who delivered an Rh-positive infant","Rh-positive mother with an Rh-negative infant","Rh-positive mother with an Rh-positive infant","Rh-negative mother with an Rh-negative infant"],key:0,
 rat:"Given to Rh-negative mothers exposed to Rh-positive blood, within 72 hours.",src:["MAT","Rho(D) immune globulin"],obj:"Identify RhoGAM candidates.",short:"Negative mom, positive baby → RhoGAM within 72 h."},
{id:"m5",sys:["mat"],fmt:"bowtie",d:3,drug:"magsulfate",concept:"mag-tox",
 stem:"G1 at 36 weeks, BP 168/112, 3+ proteinuria, headache, magnesium sulfate infusing. Two hours later: RR 10, reflexes absent, says she feels 'hot all over.'",
 cond:["Magnesium toxicity","Eclamptic seizure","Placental abruption","Expected magnesium effect"],condKey:0,
 act:["Stop the magnesium infusion","Have calcium gluconate ready","Increase the infusion to prevent seizures","Place supine","Encourage ambulation"],actKey:[0,1],
 mon:["Respiratory rate","Patellar reflexes","Blood glucose","Hemoglobin A1C","Visual acuity"],monKey:[0,1],
 rat:"Low RR, absent reflexes and flushing are toxicity signs. Stop the infusion, prepare calcium gluconate, and monitor respirations and reflexes.",
 src:["MAT","Magnesium sulfate"],obj:"Link magnesium toxicity cues to actions and monitoring.",short:"Mag tox → stop + calcium; watch RR and reflexes."},
{id:"m6",sys:["mat","gi"],fmt:"mc",d:2,drug:"misoprostol",concept:"pregnancy-cx",
 stem:"Which medication order for a 24-year-old who might be pregnant should the nurse clarify first?",
 opts:["Misoprostol for NSAID ulcer prevention","Acetaminophen for headache","Famotidine for heartburn","Ferrous sulfate for anemia"],key:0,
 rat:"Misoprostol is contraindicated in pregnancy (can induce miscarriage).",src:["GI","GI prostaglandin"],obj:"Spot pregnancy contraindications.",short:"Misoprostol: not in pregnancy."},

/* ── PEDS ── */
{id:"k1",sys:["peds","blood"],fmt:"mc",d:1,drug:"ferrous",concept:"iron-teach",
 stem:"Which instruction about liquid iron for a 3-year-old is correct?",
 opts:["Give it through a straw or to the back of the mouth, then brush teeth","Mix it in the child's bottle of milk","Stop the iron if stools turn black","Give it with an antacid to prevent upset stomach"],key:0,
 rat:"Liquid iron stains teeth; give with a straw and provide oral hygiene. Black stools are expected. Milk and antacids reduce absorption.",
 src:["BL","Iron administration"],obj:"Teach pediatric iron administration.",short:"Iron: straw, juice, black stools OK, no antacid/milk."},
{id:"k2",sys:["peds","cardio"],fmt:"mc",d:2,drug:"digoxin",concept:"digoxin-check",
 stem:"An infant's apical pulse is 84 before a scheduled digoxin dose. What should the nurse do?",
 opts:["Withhold and report the pulse to the prescriber","Give the dose and recheck in 1 hour","Give half the dose","Count the radial pulse instead"],key:0,
 rat:"Your source: report a child's pulse <90 because the prescriber may decide to withhold. Always take the apical pulse for a full minute.",
 src:["CV","Digoxin implementation (children)"],obj:"Apply pediatric digoxin parameters.",short:"Child digoxin: pulse <90 → report."},
{id:"k3",sys:["peds","pain"],fmt:"mc",d:2,drug:"acetaminophen",concept:"apap-dose",
 stem:"A 14-year-old who weighs 42 kg has acetaminophen ordered. Per your course file, what is the maximum single dose?",
 opts:["15 mg/kg (up to 750 mg)","1000 mg","10 mg/kg (up to 325 mg)","650 mg every 2 hours"],key:0,
 rat:"For ≥13 years and <50 kg: 15 mg/kg every 6 h (or 12.5 mg/kg every 4 h), single dose not over 15 mg/kg up to 750 mg; max 75 mg/kg up to 3750 mg/day.",
 src:["PAIN","Acetaminophen dosing"],obj:"Apply weight-based acetaminophen limits.",short:"Under 50 kg: 15 mg/kg/dose."},
{id:"k4",sys:["peds","psych"],fmt:"mc",d:2,drug:"methylphenidate",concept:"stimulant",
 stem:"A parent asks when to give their child's methylphenidate. Best response?",
 opts:["In the morning, with or after breakfast; avoid late-day doses","At bedtime to help sleep","Only on school days when behavior is bad","With a caffeinated drink to boost the effect"],key:0,
 rat:"Stimulants cause insomnia and appetite suppression; give in the morning with/after breakfast and avoid late doses. (Reference content — verify.)",
 src:null,obj:"Teach stimulant timing.",short:"Stimulants: mornings, monitor growth."},
{id:"k5",sys:["peds","endo"],fmt:"mc",d:2,drug:"levothyroxine",concept:"congenital-hypo",
 stem:"Parents of an infant with congenital hypothyroidism ask why daily levothyroxine matters so much. Best response?",
 opts:["\"Prompt, consistent treatment prevents permanent cognitive impairment.\"","\"It only matters until the baby can walk.\"","\"It's mostly to prevent weight gain.\"","\"Missing doses is fine if the baby seems energetic.\""],key:0,
 rat:"Prompt treatment is critical to avoid permanent cognitive impairment; noncompliance can harm intelligence.",
 src:["PEDS","Hypothyroidism in children"],obj:"Explain the importance of thyroid replacement in infants.",short:"Congenital hypothyroid: treat early, every day, for life."},
{id:"k6",sys:["peds","onc"],fmt:"sata",d:2,drug:"filgrastim",concept:"neutropenia",
 stem:"A child receiving chemotherapy for ALL has an ANC of 400. Which actions are appropriate? Select all that apply.",
 opts:["Private room with neutropenic precautions","Strict hand hygiene","Monitor temperature closely","Give filgrastim subcut as prescribed","Rectal temperatures every 4 hours","Fresh flowers to cheer the child"],key:[0,1,2,3],
 rat:"Neutropenic precautions, hand hygiene, temperature monitoring and G-CSF reduce infection. Rectal routes risk mucosal injury; fresh flowers carry organisms.",
 why:{4:"Avoid rectal routes in neutropenia.",5:"Fresh flowers/plants are restricted."},
 src:["PEDS","Child with cancer: infection interventions"],obj:"Plan neutropenic care.",short:"Neutropenia: protect from germs; no rectal anything."},

/* ── REPRO ── */
{id:"g1",sys:["repro"],fmt:"sata",d:2,drug:"coc",concept:"coc-aches",
 stem:"A client using a combined hormonal contraceptive patch should report which symptoms immediately? Select all that apply.",
 opts:["Severe headache","Blurred vision","Calf pain","Shortness of breath","Mild breast tenderness the first month","Chest pain"],key:[0,1,2,3,5],
 rat:"Your Reproductive file lists severe headache, dizziness, blurred vision, leg pain, shortness of breath, chest pain and acute abdominal pain as serious effects (possible thromboembolism).",
 why:{4:"Common and usually transient."},src:["REP","Transdermal contraceptive teaching"],obj:"Teach serious contraceptive warning signs.",short:"ACHES = report."},
{id:"g2",sys:["repro"],fmt:"mc",d:2,drug:"coc",concept:"coc-risk",
 stem:"Which client is at highest risk for serious cardiovascular effects from a combined oral contraceptive?",
 opts:["38-year-old who smokes 20 cigarettes a day","22-year-old runner","30-year-old with seasonal allergies","26-year-old who drinks coffee daily"],key:0,
 rat:"Risk increases with age and heavy smoking (≥15 cigarettes/day), significant over 35.",src:["REP","Combined contraceptives: smoking"],obj:"Identify OC risk factors.",short:"Over 35 + smoker = estrogen danger."},
{id:"g3",sys:["repro","uri"],fmt:"mc",d:2,drug:"finasteride",concept:"finasteride",
 stem:"A client starting finasteride for BPH lives with his pregnant wife. Which teaching is essential?",
 opts:["She should not handle crushed or broken tablets","Take the tablet only at bedtime","Expect results within 3 days","He must stop if his PSA drops"],key:0,
 rat:"Finasteride absorbed through skin can harm a male fetus. Results take 6–12 months; PSA drops ~50% (expected).",
 src:["REP","Finasteride"],obj:"Teach finasteride safety.",short:"Finasteride: pregnant women don't touch crushed tablets."},
{id:"g4",sys:["repro","cardio"],fmt:"mc",d:2,drug:"sildenafil",concept:"pde5-nitrate",
 stem:"A client with angina asks about sildenafil. Which response is most important?",
 opts:["\"Taking it with nitroglycerin can drop your blood pressure dangerously; talk with your provider.\"","\"Take it anytime as often as needed.\"","\"It also increases sexual desire.\"","\"It works without sexual stimulation.\""],key:0,
 rat:"PDE-5 inhibitors with nitrates cause severe hypotension; patients with CV disease need provider approval. Not more than once per 24 h; stimulation is required; no aphrodisiac effect.",
 src:["REP","Phosphodiesterase inhibitors"],obj:"Recognize PDE-5 + nitrate interaction.",short:"Sildenafil + nitro = BP crash."},
{id:"g5",sys:["repro","infect"],fmt:"mc",d:2,drug:"coc",concept:"coc-interaction",
 stem:"A client taking an oral contraceptive is prescribed a 10-day antibiotic course. What should the nurse teach?",
 opts:["Use an additional form of birth control during the course","Stop the pill until the antibiotic is finished","Take the pill twice daily","No change is needed"],key:0,
 rat:"Your source: antibacterials (penicillins, tetracyclines, rifampin) can make contraceptives less effective; use backup.",
 src:["REP","Oral contraceptive interactions"],obj:"Apply OC interactions.",short:"Antibiotics + pill → backup method."},

/* ── BLOOD ── */
{id:"b1",sys:["blood"],fmt:"mc",d:2,drug:"ferrous",concept:"iron-teach",
 stem:"Which statement shows a need for more teaching about oral iron?",
 opts:["\"I'll take it with my antacid so my stomach doesn't hurt.\"","\"Orange juice helps me absorb it.\"","\"My stools may turn dark.\"","\"I'll keep it out of my grandkids' reach.\""],key:0,
 rat:"Antacids reduce iron absorption. Vitamin C enhances it; dark stools are expected; iron is toxic to children.",
 src:["BL","Iron administration"],obj:"Evaluate iron teaching.",short:"Iron's enemy = antacid."},
{id:"b2",sys:["blood","cardio"],fmt:"mc",d:3,drug:"enoxaparin",concept:"lmwh",
 stem:"A client receiving enoxaparin had a lumbar epidural catheter removed yesterday and now reports new leg numbness and weakness. What is the priority?",
 opts:["Report immediately — possible spinal/epidural hematoma","Reposition and recheck in 4 hours","Give the next enoxaparin dose on time","Apply warm packs to the legs"],key:0,
 rat:"Anticoagulants given after spinal/epidural procedures raise the risk of spinal hematoma, which can cause paralysis.",
 src:["CV","Anticoagulants: spinal/epidural caution"],obj:"Recognize spinal hematoma risk.",short:"Anticoagulant + epidural + new leg weakness = emergency."},
{id:"b3",sys:["blood","onc"],fmt:"matrix",d:2,concept:"growth-factors",
 stem:"Match the drug to the blood cell line it supports.",
 rows:["Filgrastim","Epoetin alfa","Ferrous sulfate"],cols:["Neutrophils/WBCs","Red blood cells (marrow stimulation)","Hemoglobin synthesis (raw material)"],key:[0,1,2],
 rat:"Filgrastim (G-CSF) raises neutrophils; epoetin stimulates RBC production; iron provides the building block for hemoglobin.",
 src:["REP","Chemotherapy adverse effects"],obj:"Distinguish hematopoietic agents.",short:"FILgrastim-WBC, EPOetin-RBC."},
{id:"b4",sys:["blood","cardio"],fmt:"mc",d:2,drug:"heparin",concept:"anticoag-antidote",
 stem:"A client on a heparin drip has hematuria and an aPTT far above the therapeutic range. Which drug should the nurse have ready?",
 opts:["Protamine sulfate","Vitamin K","Naloxone","Calcium gluconate"],key:0,
 rat:"Protamine reverses heparin. Vitamin K reverses warfarin; naloxone reverses opioids; calcium gluconate reverses magnesium.",
 src:["MS","PE: heparin antagonist"],obj:"Match antidote to anticoagulant.",short:"Protamine for heParin."},
{id:"b5",sys:["blood","cardio"],fmt:"mc",d:2,drug:"apixaban",concept:"doac",
 stem:"Which statement about apixaban is accurate?",
 opts:["Routine INR monitoring is not required","It is reversed with vitamin K","It is monitored with aPTT","Leafy greens must be eaten consistently"],key:0,
 rat:"DOACs have predictable effects and don't need routine INR. (Reference content — not in your course files.)",
 src:null,obj:"Differentiate DOACs from warfarin.",short:"DOAC: no INR."},

/* ── INTEG ── */
{id:"i1",sys:["integ"],fmt:"matrix",d:2,concept:"burn-topicals",
 stem:"For each burn agent, select its key disadvantage.",
 rows:["Silver sulfadiazine","Mafenide","Silver nitrate"],cols:["Gray skin; depressed granulocytes","Painful; metabolic acidosis","Stains everything; electrolyte imbalance"],key:[0,1,2],
 rat:"From Table 43.6 in your Integumentary file.",src:["INT","Table 43.6 Topical burn medications"],obj:"Compare topical burn agents.",short:"Silvadene-gray, Mafenide-acid, Silver nitrate-stains."},
{id:"i2",sys:["integ","peds"],fmt:"sata",d:2,drug:"isotretinoin",concept:"isotretinoin",
 stem:"A 17-year-old female is starting isotretinoin. What should the plan include? Select all that apply.",
 opts:["Negative pregnancy test before starting","Two reliable contraception methods/effective contraception through 1 month after","Screening for depression and suicidal thoughts","Lipid monitoring","Encourage tanning to dry lesions"],key:[0,1,2,3],
 rat:"Isotretinoin is absolutely contraindicated in pregnancy, can cause depression/suicidal ideation, raises cholesterol and triglycerides, and causes photosensitivity.",
 why:{4:"Photosensitivity — avoid sun/tanning."},src:["PEDS","Adolescent acne"],obj:"Plan isotretinoin safety.",short:"Isotretinoin: no pregnancy, watch mood, check lipids."},
{id:"i3",sys:["integ","infect"],fmt:"mc",d:2,drug:"amoxicillin",concept:"abx-allergy",
 stem:"A client with cellulitis develops a new itchy rash after the second dose of penicillin. What is the nurse's first action?",
 opts:["Hold the next dose and report the rash","Give diphenhydramine and continue","Apply hydrocortisone cream","Document as expected"],key:0,
 rat:"Your source: penicillin can cause severe allergic reactions that start as rashes — stop and report before it becomes anaphylaxis.",
 src:["INT","Cellulitis: antibiotics"],obj:"Respond to suspected drug allergy.",short:"New rash on antibiotic → hold and report."},
{id:"i4",sys:["integ"],fmt:"mc",d:2,drug:"silversulf",concept:"burn-topicals",
 stem:"Which lab result is most important to monitor in a client with prolonged silver sulfadiazine use?",
 opts:["WBC count","Serum magnesium","PT/INR","TSH"],key:0,
 rat:"Prolonged use may depress granulocyte formation.",src:["INT","Table 43.6"],obj:"Monitor topical burn agent effects.",short:"Silvadene → WBC."},
{id:"i5",sys:["integ","infect"],fmt:"mc",d:1,drug:"acyclovir",concept:"antiviral",
 stem:"Which medication class does the nurse anticipate for an older adult with a painful dermatomal vesicular rash (herpes zoster)?",
 opts:["Antiviral such as acyclovir","Antifungal cream","Broad-spectrum antibiotic","Topical steroid alone"],key:0,
 rat:"Shingles management includes acyclovir (oral/IV), analgesics and measures to prevent secondary infection.",src:["INT","Herpes zoster management"],obj:"Match antiviral to indication.",short:"Shingles → acyclovir."},

/* ── MSK ── */
{id:"s1",sys:["msk"],fmt:"mc",d:2,drug:"alendronate",concept:"bisphos",
 stem:"Which morning routine shows correct alendronate use?",
 opts:["Swallow with a full glass of water on waking, stay upright, eat 30 minutes later","Take with coffee and breakfast","Take with milk at bedtime","Chew the tablet then lie down"],key:0,
 rat:"Bisphosphonates are taken with a full glass of water 30 minutes before food or other meds; staying upright reduces esophageal injury (reference).",
 src:["MSK","Osteoporosis drug therapy"],obj:"Teach bisphosphonate administration.",short:"Water, wait (upright), then eat."},
{id:"s2",sys:["msk"],fmt:"mc",d:2,drug:"allopurinol",concept:"gout",
 stem:"Three weeks after starting allopurinol, a client calls with a gout flare and wants to stop the drug. Best response?",
 opts:["\"Flares are common early; keep the same dose and I'll tell your provider.\"","\"Stop it and we'll find a new medicine.\"","\"Double the dose until the flare ends.\"","\"Limit fluids to concentrate the drug.\""],key:0,
 rat:"Attacks may increase during the first months; continue without changing dose. Fluids are increased.",
 src:["MSK","Gout drug therapy"],obj:"Support allopurinol adherence.",short:"Allopurinol: early flares, don't quit, drink up."},
{id:"s3",sys:["msk","neuro"],fmt:"mc",d:3,drug:"dantrolene",concept:"mh",
 stem:"During surgery, a client develops rapidly rising temperature, jaw and muscle rigidity, and tachycardia after anesthesia induction. Which drug should the team prepare?",
 opts:["Dantrolene","Naloxone","Protamine","Glucagon"],key:0,
 rat:"Malignant hyperthermia — an unusual reaction to anesthetic/neuromuscular agents — is treated with dantrolene, a direct-acting muscle relaxant.",
 src:["MSK","Dantrolene uses"],obj:"Recognize malignant hyperthermia treatment.",short:"Hot + rigid after anesthesia → dantrolene."},
{id:"s4",sys:["msk"],fmt:"sata",d:2,drug:"colchicine",concept:"gout",
 stem:"Which teaching applies to colchicine for acute gout? Select all that apply.",
 opts:["Take at the first sign of a flare","Report nausea, vomiting or diarrhea","Drink 8–12 glasses of fluid daily","It lowers uric acid in the blood","Follow a low-purine diet and limit alcohol"],key:[0,1,2,4],
 rat:"Colchicine works best early; GI effects are common; fluids and low-purine diet help. It does not lower uric acid (not uricosuric).",
 why:{3:"Colchicine doesn't change uric acid levels."},src:["MSK","Colchicine; gout teaching plan"],obj:"Teach colchicine use.",short:"Colchicine: early, GI effects, doesn't lower uric acid."},
{id:"s5",sys:["msk","pain"],fmt:"mc",d:2,drug:"ibuprofen",concept:"nsaid",
 stem:"A client with chronic kidney disease and K⁺ 5.8 mEq/L takes several home medications. Which is most likely contributing?",
 opts:["Ibuprofen","Furosemide","Hydrochlorothiazide","Levothyroxine"],key:0,
 rat:"NSAIDs (and ACE inhibitors, ARBs, spironolactone, potassium supplements) raise potassium; loop and thiazide diuretics lower it.",
 src:["MSK","F&E lecture: hyperkalemia causes"],obj:"Identify drugs causing hyperkalemia.",short:"High-K crew: NSAIDs, prils, sartans, spironolactone, K supplements."},

/* ── GI ── */
{id:"gi1",sys:["gi"],fmt:"mc",d:2,drug:"lactulose",concept:"lactulose",
 stem:"A client with cirrhosis is confused and has asterixis. Which outcome shows lactulose is effective?",
 opts:["Improved orientation and lower ammonia level","One hard stool every 3 days","Increased abdominal girth","Weight gain of 2 kg"],key:0,
 rat:"Lactulose lowers ammonia; improved mental status is the goal.",src:["GI","Hepatic encephalopathy"],obj:"Evaluate lactulose therapy.",short:"Lactulose works → clearer head, lower ammonia."},
{id:"gi2",sys:["gi"],fmt:"matrix",d:2,concept:"gi-timing",
 stem:"Select the correct administration timing for each GI drug.",
 rows:["Omeprazole","Sucralfate","Famotidine with antacid"],cols:["30–60 min before a meal","Empty stomach before meals and at bedtime","Separate the two by at least 2 hours"],key:[0,1,2],
 rat:"PPIs before meals; sucralfate QID before meals and HS; H2 blockers and antacids separated by 2 h.",src:["GI","GI medications (Mamani Part 2)"],obj:"Time GI drugs correctly.",short:"PPI before meals; Carafate empty stomach; antacids 2 h apart."},
{id:"gi3",sys:["gi"],fmt:"sata",d:2,drug:"omeprazole",concept:"ppi",
 stem:"A client has taken omeprazole for 3 years. Which risks should the nurse monitor? Select all that apply.",
 opts:["Fractures","Low magnesium","Vitamin B12 deficiency","C. difficile diarrhea","Hyperkalemia"],key:[0,1,2,3],
 rat:"Your GI file lists fractures, hypomagnesemia, B12 deficiency, rash and C. diff as serious PPI effects.",
 why:{4:"Not a listed PPI effect."},src:["GI","PPIs"],obj:"Monitor long-term PPI therapy.",short:"Long-term PPI: bones, Mg, B12, C. diff."},
{id:"gi4",sys:["gi"],fmt:"mc",d:2,drug:"metoclopramide",concept:"eps-td",
 stem:"A client on metoclopramide develops facial grimacing and tongue movements. What should the nurse do?",
 opts:["Hold the next dose and report the movements","Give it with food","Document as expected","Increase fluids"],key:0,
 rat:"Metoclopramide can cause extrapyramidal symptoms and tardive dyskinesia.",src:["GI","Prokinetic agents"],obj:"Recognize metoclopramide EPS.",short:"Reglan can cause EPS/TD."},
{id:"gi5",sys:["gi","onc"],fmt:"mc",d:1,drug:"ondansetron",concept:"antiemetic",
 stem:"When should ondansetron be given for chemotherapy-induced nausea?",
 opts:["Before the chemotherapy begins","Only after vomiting starts","The next morning","Mixed into the chemo bag"],key:0,
 rat:"Antiemetics prevent CINV best when given before chemotherapy (reference timing).",src:["REP","Chemo nausea management"],obj:"Time antiemetics.",short:"Antiemetic before chemo."},

/* ── URINARY ── */
{id:"u1",sys:["uri"],fmt:"mc",d:1,drug:"phenazopyridine",concept:"pyridium",
 stem:"A client taking phenazopyridine calls about bright orange urine. Best response?",
 opts:["\"That is expected; it's from the medicine.\"","\"Go to the ER — it may be blood.\"","\"Stop your antibiotic.\"","\"Drink less water.\""],key:0,
 rat:"Phenazopyridine turns urine bright orange; limit use to 2 days unless told otherwise; it doesn't treat infection.",
 src:["URI","UTI treatment"],obj:"Teach expected phenazopyridine effects.",short:"Pyridium = orange urine; pain only."},
{id:"u2",sys:["uri"],fmt:"sata",d:2,concept:"uti-teach",
 stem:"Which UTI teaching points are correct? Select all that apply.",
 opts:["Finish all of the antibiotic even if symptoms improve","Drink enough to produce about 2000 mL of urine daily unless restricted","Use phenazopyridine for 2 weeks","Symptoms often improve in 24–48 hours","Stop the antibiotic once burning stops"],key:[0,1,3],
 rat:"Complete the course; hydrate to 2000 mL output; relief typically in 24–48 h; phenazopyridine limited to 2 days.",
 why:{2:"Limit to 2 days.",4:"Stopping early promotes recurrence."},src:["URI","UTI treatment and teaching"],obj:"Teach UTI medication use.",short:"Finish antibiotics; Pyridium 2 days max."},
{id:"u3",sys:["uri","neuro"],fmt:"mc",d:3,drug:"oxybutynin",concept:"bladder-drugs",
 stem:"Which drug would treat an older adult's nonobstructive urinary retention?",
 opts:["Bethanechol","Oxybutynin","Phenazopyridine","Tamsulosin is the only option"],key:0,
 rat:"Bethanechol (cholinergic) contracts the bladder. Oxybutynin (anticholinergic) treats urgency/incontinence and can cause retention. Note: one slide in your Neuro file reverses these — see the flag on oxybutynin.",
 src:["PAIN","Bethanechol"],obj:"Differentiate bladder drugs.",short:"Bethanechol = 'bladder go'; oxybutynin = 'bladder slow'."},
{id:"u4",sys:["uri","infect"],fmt:"mc",d:2,drug:"smxtmp",concept:"bactrim-k",
 stem:"A client on lisinopril is prescribed sulfamethoxazole-trimethoprim for a UTI. Which lab should the nurse monitor?",

/* ================= MED MATH engine — pure functions, no DOM =================
   Every problem's answer is computed from its own inputs by the calc functions below,
   and every generator is re-checked by an independent solver in tests/mm.test.js. */
const MM = (() => {
  const EPS = 1e-6;
  /* round half up, guarding binary float artifacts (e.g. 2.25 → 2.3) */
  const round = (v, d = 0) => { const f = 10 ** d; return Math.round(Number((v * f).toPrecision(12))) / f; };
  const roundML = v => (Math.abs(v) < 1 ? round(v, 2) : round(v, 1));
  const ROUND_RULES = {
    ml: "Round mL to the tenth (or to the hundredth when the volume is less than 1 mL).",
    tenth: "Round to the nearest tenth.", hundredth: "Round to the nearest hundredth.", whole: "Round to the nearest whole number.",
    gtt: "Round drops per minute to the nearest whole drop — you can't count part of a drop.",
    kg: "Round kilograms to the nearest tenth before using the weight in a dose calculation.",
    tab: "Tablets: give whole tablets, or halves only when the tablet is scored.", none: "No rounding needed."
  };
  /* display: leading zero, no trailing zeros, thousands separators */
  const fmt = n => (typeof n !== "number" || !isFinite(n)) ? "—" : round(n, 4).toLocaleString("en-US", { maximumFractionDigits: 4 });

  /* ---------- calculation functions ---------- */
  const calc = {
    lbToKg: lb => lb / 2.2, kgToLb: kg => kg * 2.2,
    gToMg: g => g * 1000, mgToG: mg => mg / 1000, mgToMcg: mg => mg * 1000, mcgToMg: mcg => mcg / 1000,
    LToMl: L => L * 1000, mlToL: ml => ml / 1000, hToMin: h => h * 60, minToH: m => m / 60,
    tspToMl: t => t * 5, tbspToMl: t => t * 15, ozToMl: o => o * 30, mlToOz: ml => ml / 30,
    dh: (desired, have, qty) => desired / have * qty,
    wtDose: (kg, perKg) => kg * perKg,
    daily: (kg, perKgDay) => kg * perKgDay,
    perDose: (kg, perKgDay, nDoses) => kg * perKgDay / nDoses,
    dosesPerDay: hoursInterval => 24 / hoursInterval,
    safeRange: (kg, lo, hi, doseMg, nDoses) => { const min = kg * lo, max = kg * hi, daily = doseMg * nDoses; return { min, max, daily, within: daily >= min - EPS && daily <= max + EPS, below: daily < min - EPS, above: daily > max + EPS }; },
    mlPerHr: (ml, hours) => ml / hours,
    gttPerMin: (ml, df, minutes) => ml * df / minutes,
    conc: (amount, ml) => amount / ml,
    rateFromDose: (dosePerHr, amount, ml) => dosePerHr / (amount / ml),
    doseFromRate: (mlPerHr, amount, ml) => mlPerHr * (amount / ml),
    mcgKgMinToMlHr: (mcgKgMin, kg, drugMg, ml) => mcgKgMin * kg * 60 / (drugMg * 1000 / ml),
    mlHrToMcgKgMin: (mlHr, kg, drugMg, ml) => mlHr * (drugMg * 1000 / ml) / 60 / kg,
    reconMl: (orderMg, finalConc) => orderMg / finalConc,
    bsa: (cm, kg) => Math.sqrt(cm * kg / 3600),
    unitsToMlU100: units => units / 100
  };

  /* ---------- seeded rng ---------- */
  function rng(seed) {
    let a = seed >>> 0;
    const next = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    return { next, int: (lo, hi) => lo + Math.floor(next() * (hi - lo + 1)), pick: arr => arr[Math.floor(next() * arr.length)], chance: p => next() < p };
  }

  /* ---------- error vocabulary ---------- */
  const ERR = {
    UNIT: "Missing or incorrect units", CONV: "Wrong conversion", FORM: "Incorrect formula or setup", DAYDOSE: "Confused mg/kg/day with mg/kg/dose",
    DIVIDE: "Forgot or miscounted the divided doses", ARITH: "Arithmetic slip", TIME: "Incorrect time conversion", DEC: "Wrong decimal placement",
    ROUND: "Incorrect rounding", SAFE: "Missed an unsafe or incomplete order", CONC: "Used the wrong concentration or volume", DF: "Drop factor misused"
  };

  /* ---------- formulas (cheat sheet + lessons) ---------- */
  const FORMULAS = {
    dh: { n: "Desired ÷ Have × Quantity", eq: "Amount = (D ÷ H) × Q", ex: "750 mg ÷ 250 mg × 1 tab = 3 tablets" },
    lbkg: { n: "Pounds → kilograms", eq: "kg = lb ÷ 2.2", ex: "154 lb ÷ 2.2 = 70 kg" },
    kglb: { n: "Kilograms → pounds", eq: "lb = kg × 2.2", ex: "25 kg × 2.2 = 55 lb" },
    metric: { n: "Metric ladder (g ↔ mg ↔ mcg, L ↔ mL)", eq: "Each step = × 1,000 going down, ÷ 1,000 going up", ex: "0.25 g × 1,000 = 250 mg; 125 mcg ÷ 1,000 = 0.125 mg" },
    time: { n: "Hours ↔ minutes", eq: "min = hr × 60   ·   hr = min ÷ 60", ex: "8 hr × 60 = 480 min" },
    household: { n: "Household → metric", eq: "1 tsp = 5 mL · 1 tbsp = 15 mL · 1 oz = 30 mL", ex: "2 tbsp × 15 mL = 30 mL" },
    round: { n: "Rounding & notation", eq: "Leading zero: 0.5 mg ✓ · No trailing zero: 5 mg ✓ (never 5.0 mg)", ex: "1.666 mL → 1.7 mL; 0.456 mL → 0.46 mL" },
    wtdose: { n: "mg/kg/dose", eq: "Dose (mg) = kg × mg/kg/dose", ex: "20 kg × 10 mg/kg/dose = 200 mg per dose" },
    wtday: { n: "mg/kg/day → per dose", eq: "Per dose = (kg × mg/kg/day) ÷ doses per day", ex: "20 kg × 30 mg/kg/day = 600 mg/day ÷ 3 = 200 mg per dose" },
    safe: { n: "Safe-dose range check", eq: "Min = kg × low · Max = kg × high · Compare ordered mg/day", ex: "20 kg: 300–500 mg/day; 180 mg q12h = 360 mg/day → within range" },
    mlhr: { n: "IV pump rate", eq: "mL/hr = total mL ÷ hours", ex: "1,000 mL ÷ 8 hr = 125 mL/hr" },
    gtt: { n: "Gravity drip rate", eq: "gtt/min = (mL × drop factor) ÷ minutes", ex: "(1,000 × 15) ÷ 480 = 31.25 → 31 gtt/min" },
    unitshr: { n: "Units/hr → mL/hr", eq: "mL/hr = ordered units/hr ÷ concentration (units/mL)", ex: "1,000 units/hr ÷ 100 units/mL = 10 mL/hr" },
    mcgkgmin: { n: "mcg/kg/min → mL/hr", eq: "mL/hr = (mcg/kg/min × kg × 60) ÷ concentration (mcg/mL)", ex: "(5 × 80 × 60) ÷ 1,600 mcg/mL = 15 mL/hr" },
    fromrate: { n: "Dose delivered by a running infusion", eq: "Dose/hr = mL/hr × concentration", ex: "22 mL/hr × 50 units/mL = 1,100 units/hr" },
    recon: { n: "Reconstitution", eq: "mL = ordered dose ÷ FINAL concentration on the label", ex: "500 mg ÷ 200 mg/mL = 2.5 mL" },
    insulin: { n: "Insulin units (U-100)", eq: "Draw up in UNITS on a U-100 insulin syringe · 100 units = 1 mL", ex: "15 units = 0.15 mL — but you measure 15 units, never mL" },
    bsa: { n: "Body surface area (Mosteller)", eq: "BSA (m²) = √(cm × kg ÷ 3,600)", ex: "√(100 × 16 ÷ 3,600) = 0.67 m²" },
    dilution: { n: "Concentration after mixing", eq: "Concentration = amount of drug ÷ total volume", ex: "2 g (2,000 mg) in 100 mL = 20 mg/mL" }
  };

  /* ---------- lessons (10 levels) ---------- */
  const LESSONS = [
    { n: 1, t: "Basic conversions", cats: ["lbkg", "kglb", "gmg", "mgmcg", "lml", "time", "household", "round"], why: "Every later formula assumes the units already match. Converting weight to kilograms first is what makes weight-based doses correct — using pounds would more than double the dose." },
    { n: 2, t: "Tablets and capsules", cats: ["tabs"], why: "Desired ÷ Have × Quantity is the backbone of almost every dosage problem. Split tablets only when they're scored and the order allows it." },
    { n: 3, t: "Oral liquids", cats: ["liquid"], why: "Liquids come as a concentration (mg per mL or mg per 5 mL). The quantity is the volume that holds the 'have' amount." },
    { n: 4, t: "Weight-based doses", cats: ["wtdose", "wtday"], why: "mg/kg/DOSE gives one dose. mg/kg/DAY gives the whole day's total — you must divide it by the number of doses. Mixing them up is a classic, dangerous error." },
    { n: 5, t: "Pediatric safe-dose range", cats: ["safe"], why: "You compare the ordered daily amount with the stated range. A passing range check is arithmetic only — real safety also depends on the drug, child, route and verified prescribing information." },
    { n: 6, t: "IV infusion pumps", cats: ["ivrate"], why: "Pumps are programmed in mL/hr. Convert minutes to hours when the time isn't already in hours." },
    { n: 7, t: "Gravity IV drip rates", cats: ["gtt"], why: "Without a pump, you count drops. The drop factor (gtt/mL) is printed on the tubing package; time must be in minutes." },
    { n: 8, t: "High-alert medications", cats: ["heparin", "insulin", "mcgkgmin", "titrate", "check"], why: "Heparin and insulin are high-alert drugs. Your Cardiovascular file requires two nurses to confirm heparin calculations and strength. Insulin is always measured in units with an insulin syringe." },
    { n: 9, t: "Reconstitution", cats: ["recon"], why: "After you add diluent, use the FINAL concentration on the label. The final volume can be larger than the diluent you added because the powder takes up space." },
    { n: 10, t: "Advanced medication math", cats: ["multistep", "fromrate", "bolus", "bsa", "dilution", "clarify"], why: "Multi-step and critical-care style problems. Marked Advanced — useful for HESI/NCLEX stretch practice beyond the LVN foundation.", adv: true }
  ];

  const CAT = {}; // filled below: {n, lesson, formula, gen}
  const units = (correct, others) => { const u = [correct, ...others.filter(x => x !== correct)]; return u.slice(0, 4).sort(); };
  function mk(o) {
    return Object.assign({ kind: "num", traps: [], given: [], unitOpts: [o.unit], methods: {}, check: [], adv: false, src: "Fictional practice values", round: "none" }, o);
  }
  const c = s => `~${s}~`; // cancelled unit marker → rendered as struck-through

  /* Desired/Have × Quantity family */
  function dhSetup({ desired, dUnit, conv = 1, convTxt = "", have, hUnit, qty, qUnit, ansUnit, rnd = "ml" }) {
    const raw = calc.dh(desired * conv, have, qty);
    const ans = rnd === "ml" ? roundML(raw) : rnd === "tab" ? raw : rnd === "tenth" ? round(raw, 1) : raw;
    const d2 = desired * conv;
    const methods = {
      da: [`${fmt(desired)} ${dUnit}${conv !== 1 ? ` × (${convTxt})` : ""} × (${fmt(qty)} ${qUnit} ÷ ${fmt(have)} ${c(hUnit)})`, `= ${fmt(raw)} ${ansUnit}${raw !== ans ? ` → ${fmt(ans)} ${ansUnit}` : ""}`],
      dh: [`${conv !== 1 ? `Convert first: ${fmt(desired)} ${dUnit} = ${fmt(d2)} ${hUnit}. ` : ""}D = ${fmt(d2)} ${hUnit}, H = ${fmt(have)} ${hUnit}, Q = ${fmt(qty)} ${qUnit}`, `(${fmt(d2)} ÷ ${fmt(have)}) × ${fmt(qty)} = ${fmt(raw)} ${ansUnit}${raw !== ans ? ` → ${fmt(ans)}` : ""}`],
      rp: [`${fmt(have)} ${hUnit} : ${fmt(qty)} ${qUnit} = ${fmt(d2)} ${hUnit} : x ${qUnit}`, `${fmt(have)}x = ${fmt(d2)} × ${fmt(qty)} → x = ${fmt(raw)}${raw !== ans ? ` → ${fmt(ans)}` : ""} ${ansUnit}`]
    };
    const traps = [
      { v: calc.dh(have, d2, qty), code: "FORM", msg: "You divided Have by Desired. The ordered (desired) dose goes on top." },
      { v: calc.dh(d2, have, 1), code: "FORM", msg: `You left out the quantity (${fmt(qty)} ${qUnit}). Multiply by the volume or count that holds the 'have' amount.` }
    ];
    if (conv !== 1) { traps.push({ v: calc.dh(desired, have, qty), code: "CONV", msg: `You didn't convert ${dUnit} to ${hUnit} first (${convTxt}). Units must match before you divide.` }); traps.push({ v: calc.dh(desired / conv, have, qty), code: "CONV", msg: "You converted in the wrong direction." }); }
    return { raw, ans, methods, traps };

function calcEval(expr) {

const IV = [0, 1, 3, 7, 14, 30, 60];
const LEVELS = ["New", "Learning", "Reviewing", "Strong", "Maintained"];
function cardKinds(d) { const k = ["core", "safety", "danger", "teach"]; if (d.anti && !/^No antidote/.test(d.anti)) k.push("anti"); return k; }
function cardQA(d, kind) {
  const n = esc(d.g);
  switch (kind) {
    case "core": return { q: `${n}: what class is it, and what is it used for?`, a: `<b>${esc(d.cls)}</b><br>${esc(d.ind)}<br><span class="muted small">How: ${esc(d.moa)}</span>` };

    case "danger": return { q: `${n}: what serious adverse effect or toxicity are you watching for?`, a: esc(d.sae) };
    case "teach": return { q: `${n}: what is the single most important thing to teach the client?`, a: esc(d.teach) };
    case "anti": return { q: `What reverses or treats ${n} toxicity?`, a: `<b>${esc(d.anti)}</b>` };
  }
}
function levelOfCard(c) { if (!c || !c.reps) return "New"; if (c.box <= 2) return "Learning"; if (c.box === 3) return "Reviewing"; if (c.box <= 5) return "Strong"; return "Maintained"; }
function drugLevel(d) {
  const cs = cardKinds(d).map(k => S.cards[d.id + ":" + k]).filter(c => c && c.reps);
  if (!cs.length) return "New";
  const avg = cs.reduce((a, c) => a + c.box, 0) / cs.length;
  const coverage = cs.length / cardKinds(d).length;
  let lvl = avg < 2.5 ? "Learning" : avg < 3.5 ? "Reviewing" : avg < 5.5 ? "Strong" : "Maintained";
  if (coverage < .6 && LEVELS.indexOf(lvl) > 2) lvl = "Reviewing";
  if (cs.some(c => c.lastRes === "miss")) lvl = "Learning";
  return lvl;
}
function gradeCard(key, res, conf) {
  const c = S.cards[key] || { box: 0, reps: 0, lapses: 0 }, now = Date.now();
  if (res === "got") {
    if (conf === "guess") { c.box = Math.max(1, c.box); c.due = now + DAY; }
    else { c.box = Math.min(6, c.box + 1); c.due = now + IV[c.box] * DAY * (conf === "unsure" ? .5 : 1); }
  } else if (res === "partial") { c.box = Math.max(1, c.box - 1); c.due = now + DAY; }
  else { c.box = 1; c.lapses = (c.lapses || 0) + 1; c.due = now + 10 * MIN; }

  S.cards[key] = c; touch(); save();
}
function dueKeys() { const now = Date.now(); return Object.entries(S.cards).filter(([, c]) => c.reps && c.due <= now).sort((a, b) => a[1].due - b[1].due).map(([k]) => k); }

const sysOf = q => q.sys || [];

  id: "hold:" + s.id, sys: (DRUG[s.drug] || { sys: [] }).sys, fmt: "mc", d: 3, drug: s.drug, concept: "hold-" + s.drug, scen: s,
  stem: "What is the safest nursing action?", opts: s.opts, key: s.key, rat: s.rat, why: s.why, src: s.src,
  obj: "Decide whether to give, hold, or clarify using the order's own parameters.", short: firstClause(s.rat) + "."
}));
function genQuestions() {
  const out = [], antis = DRUGS.filter(d => d.anti && !/^No antidote/.test(d.anti));
  const others = (d, pool, field, n = 3) => shuffle(pool.filter(o => o.id !== d.id && !o.sys.some(s => d.sys.includes(s)) && field(o) && field(o) !== field(d))).reduce((acc, o) => { const v = field(o); if (!acc.includes(v) && acc.length < n) acc.push(v); return acc; }, []);
  DRUGS.forEach(d => {
    const base = { sys: d.sys, drug: d.id, gen: true, src: d.src, d: 1 };
    if (d.anti && !/^No antidote/.test(d.anti)) {
      const ds = others(d, antis, o => firstClause(o.anti));
      if (ds.length === 3) { const opts = shuffle([firstClause(d.anti), ...ds]); out.push({ ...base, id: `gen:${d.id}:anti`, fmt: "mc", concept: d.id + "-anti", stem: `A client shows signs of ${d.g} toxicity. Which agent should the nurse anticipate?`, opts, key: opts.indexOf(firstClause(d.anti)), rat: `${d.anti} is the reversal agent for ${d.g}. ${d.exam}`, obj: `Recall the antidote for ${d.g}.`, short: `${d.g} → ${d.anti}.` }); }
    }
    const dc = others(d, DRUGS, o => o.cls);
    if (dc.length === 3) { const opts = shuffle([d.cls, ...dc]); out.push({ ...base, id: `gen:${d.id}:cls`, fmt: "mc", concept: d.id + "-cls", stem: `${d.g} (${d.b}) belongs to which drug class?`, opts, key: opts.indexOf(d.cls), rat: `${d.g} is a ${d.cls}. ${d.moa}`, obj: `Classify ${d.g}.`, short: `${d.g} = ${d.cls}.` }); }
    const ds2 = others(d, DRUGS, o => firstClause(o.sae));

/* ---------- GAMES ---------- */
const GMODES = [
  ["brand", "Generic → brand", d => d.b && !/^[—(]/.test(d.b) ? d.b.split(",")[0].trim() : null],
  ["class", "Drug → class", d => d.cls],
  ["mech", "Class → mechanism", d => d.moa, d => d.cls],
  ["ind", "Drug → indication", d => firstClause(d.ind)],
  ["ae", "Drug → serious adverse effect", d => firstClause(d.sae)],
  ["anti", "Drug → antidote", d => d.anti && !/^No antidote/.test(d.anti) ? firstClause(d.anti) : null],
  ["lab", "Drug → lab or monitoring", d => firstClause(d.mon)]
];
const GAME = { mode: "anti", pairs: [], left: [], right: [], selL: null, selR: null, done: new Set(), err: 0, start: 0, over: false };
function newGame(mode) {
  const m = GMODES.find(x => x[0] === mode); GAME.mode = mode;
  const L = m[3] || (d => d.g);
  const pool = shuffle(DRUGS.filter(d => m[2](d)));
  const pairs = [], seenR = new Set(), seenL = new Set();
  for (const d of pool) { const r = m[2](d), l = L(d); if (seenR.has(r) || seenL.has(l)) continue; seenR.add(r); seenL.add(l); pairs.push({ id: d.id, l, r }); if (pairs.length === 5) break; }
  Object.assign(GAME, { pairs, left: shuffle(pairs.map(p => p.id)), right: shuffle(pairs.map(p => p.id)), selL: null, selR: null, done: new Set(), err: 0, start: Date.now(), over: false });
}
function vGames(el) {
  if (!GAME.pairs.length) newGame(GAME.mode);
  const P0 = Object.fromEntries(GAME.pairs.map(p => [p.id, p]));
  const secs = Math.round((Date.now() - GAME.start) / 1000);
  el.innerHTML = `<div class="head"><span class="label">Matching games</span><h1>Make the pairs.</h1><p>Pick a tile on the left and its match on the right. Works with mouse, touch, or keyboard (<span class="kbd">Tab</span> to move, <span class="kbd">Enter</span> to choose).</p></div>
   <div class="seg" role="group" aria-label="Game type">${GMODES.map(m => `<button data-mode="${m[0]}" aria-pressed="${GAME.mode === m[0]}">${esc(m[1])}</button>`).join("")}</div>
   <div class="card stack">${GAME.over ? `<div class="fb ok"><h4>${ico("check")} All ${GAME.pairs.length} matched in ${secs}s with ${GAME.err} miss${GAME.err === 1 ? "" : "es"}.</h4><div class="small">Best for this game: ${S.games.best[GAME.mode] != null ? S.games.best[GAME.mode] + " misses" : "—"}</div><div class="row"><button class="btn primary" id="again">New round</button></div></div>` : `<div class="row between small"><span>${GAME.done.size}/${GAME.pairs.length} matched · ${GAME.err} miss${GAME.err === 1 ? "" : "es"}</span><button class="btn sm ghost" id="again">Shuffle new set</button></div>`}
    <div class="match"><div class="col" aria-label="Left column">${GAME.left.map(id => `<button class="tile ${GAME.done.has(id) ? "done" : ""}" data-l="${id}" aria-pressed="${GAME.selL === id}" ${GAME.done.has(id) ? "disabled" : ""}>${esc(P0[id].l)}</button>`).join("")}</div>
    <div class="col" aria-label="Right column">${GAME.right.map(id => `<button class="tile ${GAME.done.has(id) ? "done" : ""}" data-r="${id}" aria-pressed="${GAME.selR === id}" ${GAME.done.has(id) ? "disabled" : ""}>${esc(P0[id].r)}</button>`).join("")}</div></div>
    <div class="small muted" aria-live="polite" id="gmsg"></div></div>${foot()}`;
  el.onclick = e => {
    const b = e.target.closest("button"); if (!b || b.disabled) return;
    if (b.dataset.mode) { newGame(b.dataset.mode); return vGames(el); }
    if (b.id === "again") { newGame(GAME.mode); return vGames(el); }
    if (b.dataset.l) GAME.selL = b.dataset.l; if (b.dataset.r) GAME.selR = b.dataset.r;
    if (GAME.selL && GAME.selR) {
      if (GAME.selL === GAME.selR) { GAME.done.add(GAME.selL); const msg = `Matched: ${P0[GAME.selL].l} → ${P0[GAME.selL].r}`; GAME.selL = GAME.selR = null;
        if (GAME.done.size === GAME.pairs.length) { GAME.over = true; S.games.played++; const b0 = S.games.best[GAME.mode]; S.games.best[GAME.mode] = b0 == null ? GAME.err : Math.min(b0, GAME.err); touch(); save(); }
        vGames(el); $("#gmsg").textContent = msg; return; }
      GAME.err++; const l = GAME.selL, r = GAME.selR; GAME.selL = GAME.selR = null; vGames(el);
      [$(`[data-l="${l}"]`), $(`[data-r="${r}"]`)].forEach(x => x && x.classList.add("shake")); $("#gmsg").textContent = "Not a match — try again."; return;
    }
    vGames(el); const again = $(`[data-${b.dataset.l ? "l" : "r"}="${b.dataset.l || b.dataset.r}"]`); again && again.focus();
  };
}
